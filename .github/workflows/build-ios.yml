name: Build iOS App (Free / Sideload)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build iOS Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .app into .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/iosApp.xcarchive/Products/Applications/iosApp.app build/Payload/
          cd build
          zip -r SekolahApp.ipa Payload
          echo "IPA Created at: $(pwd)/SekolahApp.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SekolahApp-iOS
          path: build/SekolahApp.ipa
          retention-days: 7
